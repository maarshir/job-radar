name: Сборка и тесты

# Код из src/ вклеивается в workflows/*.json здесь же: если после npm run build
# файлы конвейеров изменились, бот коммитит их в main. Затем тесты.
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Сборка конвейеров
        if: github.event_name != 'pull_request'
        run: |
          npm run build
          if ! git diff --quiet -- workflows; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
            git add workflows
            git commit -m 'Сборка конвейеров из src/'
            git push
          fi

      - name: Тесты
        run: npm test
